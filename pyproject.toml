[project]
name = "streamlit-video-chat-example"
version = "0.1.0"
description = ""
authors = [
  { name = "Yuichiro Tachibana (Tsuchiya)", email = "t.yic.yt@gmail.com" },
]
license = "MIT"
requires-python = ">=3.10,<3.15"
dependencies = [
  "av>=16.0.1,<17",  # PyAV 17's multithreaded reformatter crashes this live macOS path: https://github.com/PyAV-Org/PyAV/pull/2187
  "numpy>=2.2.6",
  "opencv-python-headless>=4.14.0.94,<5",
  "streamlit>=1.60.0,<2",
  "streamlit-server-state>=0.20.2",
  "streamlit-webrtc>=0.76.3",
]

[dependency-groups]
dev = [
  "black>=26.5.1,<27",
  "flake8>=7.3.0,<8",
  "isort>=8.0.1,<9",
  "mypy>=2.3.0,<3",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ['py310']
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.isort]
# https://pycqa.github.io/isort/docs/configuration/black_compatibility/
profile = "black"
multi_line_output = 3
