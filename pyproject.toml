[project]
name = "streamlit-video-chat-example"
version = "0.1.0"
description = ""
authors = [
  { name = "Yuichiro Tachibana (Tsuchiya)", email = "t.yic.yt@gmail.com" },
]
license = "MIT"
requires-python = ">=3.10,<3.15"
dependencies = [
  "av>=16.0.1,<17",  # PyAV 17's multithreaded reformatter crashes this live macOS path: https://github.com/PyAV-Org/PyAV/pull/2187
  "numpy>=2.2.6",
  "opencv-python-headless>=4.14.0.94,<5",
  "streamlit>=1.60.0,<2",
  "streamlit-server-state>=0.20.2",
  "streamlit-webrtc>=0.76.3",
]

[dependency-groups]
dev = [
  "mypy>=2.3.0,<3",
  "ruff>=0.16.1,<0.17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
